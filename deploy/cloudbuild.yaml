steps:
  # 构建Docker镜像
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sovi-demo:$BUILD_ID', '.']
    
  # 推送镜像到Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sovi-demo:$BUILD_ID']
    
  # 部署到Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sovi-demo'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sovi-demo:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'ENV=production,DEBUG=False,LOCAL_DEV=False,PROJECT_ID=$PROJECT_ID,INSTANCE_CONNECTION_NAME=sovi-demo:us-central1:snap-solve-db,USE_GCS_STORAGE=true,GCS_BUCKET_NAME=sovi-demo-images,DB_NAME=app_data,DB_USER=app_user,USE_POSTGRESQL=true'
      - '--set-secrets'
      - 'GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=db-password:latest'
      - '--service-account'
      - 'sovi-demo-storage@sovi-demo.iam.gserviceaccount.com'

images:
  - 'gcr.io/$PROJECT_ID/sovi-demo:$BUILD_ID'
